<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triangles of Impact</title>
<style>
  :root {
    color-scheme: dark;
    --bg-deep: #020617; --bg-mid: #0f172a; --panel: #0f172a; --panel-2: #1e293b;
    --line: #1e293b; --line-soft: rgba(51,65,85,.6);
    --text: #f1f5f9; --muted: #94a3b8; --dim: #64748b;
    --cyan: #22d3ee; --cyan-btn: #0891b2; --cyan-btn-hover: #06b6d4;
    --good: #22c55e; --bad: #ef4444; --gold: #eab308;
    --emerald-btn: #059669; --emerald-btn-hover: #10b981; --orange: #f97316;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg-deep); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  button { font-family: inherit; }

  /* Header */
  header { padding: 18px 24px; background: var(--panel); border-bottom: 1px solid var(--line); box-shadow: 0 20px 40px -20px rgba(0,0,0,.6); z-index: 20; }
  .header-inner { max-width: 64rem; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  h1 { margin: 0; font-size: clamp(20px, 3.2vw, 26px); font-weight: 900; letter-spacing: -0.04em; text-transform: uppercase;
       background: linear-gradient(90deg, #34d399, #06b6d4); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .subtitle { margin: 4px 0 0; color: var(--dim); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; }
  .icon-btn { background: none; border: 0; padding: 8px; cursor: pointer; color: var(--muted); border-radius: 10px; display: inline-flex; transition: color .2s, background .2s; }
  .icon-btn:hover { color: #fff; background: rgba(255,255,255,.05); }
  .icon-btn.reset { color: var(--orange); }
  .icon-btn.reset:hover { color: #fb923c; }
  .icon-btn:focus-visible, .node:focus-visible, .cta:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
  .icon-btn svg { width: 20px; height: 20px; }

  /* Stage */
  main { position: relative; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center;
         background: radial-gradient(circle at center, var(--bg-mid) 0%, var(--bg-deep) 100%); }
  #status { padding: 10px 12px 0; color: var(--dim); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  #status b { color: var(--text); }
  #stage { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; padding: 8px 12px 12px; }
  #board { position: relative; }
  #svg-layer { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 1; }
  #labels-layer, #nodes-layer { position: absolute; inset: 0; pointer-events: none; }
  #labels-layer { z-index: 2; }
  #nodes-layer { z-index: 3; }

  .node {
    position: absolute; transform: translate(-50%, -50%);
    pointer-events: auto; cursor: pointer;
    padding: .55em 1.1em; border-radius: 999px; border: 2px solid var(--line-soft);
    background: rgba(15,23,42,.9); color: var(--muted);
    font-size: var(--fs, 14px); font-weight: 900; letter-spacing: -0.01em; line-height: 1.15;
    text-align: center; max-width: 24%; width: max-content;
    overflow-wrap: normal; word-break: keep-all; hyphens: none;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,.4);
    transition: transform .3s cubic-bezier(.4,0,.2,1), border-color .3s, color .3s, background-color .3s, box-shadow .3s;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .node:hover { border-color: #64748b; }
  .node.selected { transform: translate(-50%, -50%) scale(1.1); z-index: 3; border-color: var(--cyan); color: #fff; background: var(--panel-2); box-shadow: 0 0 15px rgba(34,211,238,.27); }
  .node.correct { border-color: var(--good); color: var(--good); box-shadow: 0 0 15px rgba(34,197,94,.3); }
  .node.incorrect { border-color: var(--bad); color: var(--bad); animation: shake .5s ease-in-out; }
  .node.solved { cursor: default; background: rgba(15,23,42,.95); }
  /* Tick and cross sit as a badge on the pill's corner, so a pill never changes width mid-game. */
  .badge { position: absolute; top: -0.45em; right: -0.35em; width: 1.35em; height: 1.35em; border-radius: 50%;
           display: flex; align-items: center; justify-content: center; background: var(--bg-deep); border: 2px solid currentColor; }
  .badge svg { width: .8em; height: .8em; }
  @keyframes shake {
    0%,100% { transform: translate(-50%,-50%) scale(1.1) translateX(0); }
    25% { transform: translate(-50%,-50%) scale(1.1) translateX(-8px); }
    50% { transform: translate(-50%,-50%) scale(1.1) translateX(8px); }
    75% { transform: translate(-50%,-50%) scale(1.1) translateX(-8px); }
  }
  .tri-label {
    position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
    font-size: calc(var(--fs, 14px) * .78); font-weight: 900; letter-spacing: .12em; text-transform: uppercase;
    text-shadow: 0 0 4px var(--bg-deep), 0 0 4px var(--bg-deep), 0 0 8px var(--bg-deep);
    opacity: 0; transition: opacity .6s;
  }
  .tri-label.show { opacity: 1; }

  /* Legend */
  footer { padding: 14px 16px; background: var(--panel); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 32px; z-index: 20; }
  .legend-item { display: flex; align-items: center; gap: 10px; opacity: .25; transition: opacity .5s, transform .5s; }
  .legend-item.on { opacity: 1; transform: scale(1.06); }
  .legend-dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .legend-label { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .12em; color: #cbd5e1; }
  footer.with-clues { gap: 10px; }
  footer.with-clues .legend-item { opacity: 1; flex: 1 1 200px; max-width: 250px; align-items: flex-start; padding: 8px 12px; border-radius: 12px; background: #0b1224; border: 2px solid var(--line); }
  footer.with-clues .legend-item .legend-dot { margin-top: 3px; opacity: .3; transition: opacity .5s; }
  footer.with-clues .legend-item.on { transform: none; }
  footer.with-clues .legend-item.on .legend-dot { opacity: 1; }
  .legend-clue { display: block; margin-top: 3px; font-size: 12px; color: var(--muted); line-height: 1.35; text-transform: none; letter-spacing: 0; font-weight: 500; }

  /* Overlays */
  .overlay { position: absolute; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .overlay.hidden { display: none; }
  #instruction-overlay { background: rgba(2,6,23,.6); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  #win-overlay { position: fixed; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: rgba(2,6,23,.88); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); overflow-y: auto; align-items: flex-start; }
  .card { background: var(--panel); border: 1px solid var(--line); text-align: center; box-shadow: 0 0 50px rgba(0,0,0,.55); }
  .intro-card { border-radius: 2rem; padding: 32px; max-width: 26rem; width: 92%; }
  .intro-card h3 { margin: 0 0 16px; color: var(--cyan); font-size: 20px; font-weight: 900; letter-spacing: -0.02em; text-transform: uppercase; }
  .intro-card p { margin: 0 0 24px; color: var(--muted); font-size: 14px; line-height: 1.65; }
  .lock { color: #34d399; font-weight: 700; text-decoration: underline; }
  .red { color: #f87171; font-weight: 700; }
  .cta { border: 0; cursor: pointer; color: #fff; font-weight: 900; text-transform: uppercase; letter-spacing: .12em; transition: background .2s, transform .2s; }
  .intro-card .cta { width: 100%; padding: 13px; border-radius: 12px; background: var(--cyan-btn); font-size: 12px; }
  .intro-card .cta:hover { background: var(--cyan-btn-hover); }
  .win-card { border-radius: 3rem; padding: 32px 28px; max-width: 34rem; width: 100%; margin: auto; }
  .trophy { display: inline-flex; padding: 14px; border-radius: 50%; background: rgba(234,179,8,.1); margin-bottom: 14px; color: var(--gold); }
  .trophy svg { width: 56px; height: 56px; }
  .win-card.compact .trophy svg { width: 40px; height: 40px; }
  .win-card.compact h2 { margin-bottom: 8px; }
  .win-card h2 { margin: 0 0 14px; font-size: clamp(34px, 7vw, 48px); font-weight: 900; font-style: italic; letter-spacing: -0.05em;
                 background: linear-gradient(90deg, #facc15, #f59e0b); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .win-msg { color: #cbd5e1; font-size: 16px; line-height: 1.6; margin: 0 0 20px; }
  .summary { list-style: none; padding: 0; margin: 0 0 18px; text-align: left; }
  .summary li { margin: 8px 0; padding: 10px 14px; background: #0b1224; border-radius: 12px; border-left: 5px solid; font-size: 14px; line-height: 1.45; }
  .summary b { color: var(--text); }
  .summary .members { color: #cbd5e1; }
  .summary .why { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; }
  .discuss { color: var(--text); font-weight: 700; margin: 0 0 22px; line-height: 1.5; }
  .win-card .cta { padding: 16px 40px; border-radius: 999px; background: var(--emerald-btn); font-size: 13px; box-shadow: 0 4px 20px rgba(16,185,129,.3); }
  .win-card .cta:hover { background: var(--emerald-btn-hover); transform: scale(1.05); }

  @media (max-width: 640px) {
    header { padding: 12px 16px; }
    footer.with-clues .legend-item { flex: 1 1 40%; padding: 6px 8px; }
    footer:not(.with-clues) { gap: 8px 16px; }
    .legend-clue { font-size: 11px; }
    .intro-card, .win-card { padding: 24px 18px; border-radius: 1.5rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .node, .legend-item, .tri-label, .cta { transition: none; }
    .node.incorrect { animation: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1 id="title"></h1>
        <p class="subtitle" id="subtitle"></p>
      </div>
      <div>
        <button class="icon-btn" id="info-btn" title="How to play" aria-label="How to play">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        </button>
        <button class="icon-btn reset" id="reset-btn" title="Reset and reshuffle" aria-label="Reset and reshuffle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div id="status" aria-live="polite"></div>
    <div id="stage">
      <div id="board">
        <svg id="svg-layer" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div id="labels-layer" aria-hidden="true"></div>
        <div id="nodes-layer"></div>
      </div>
    </div>

    <div class="overlay" id="instruction-overlay">
      <div class="card intro-card" role="dialog" aria-modal="true" aria-labelledby="intro-heading">
        <h3 id="intro-heading"></h3>
        <p><span id="intro-text"></span><br><br>
          Correct sets will <span class="lock">LOCK</span> into the map permanently.<br>
          Incorrect sets will turn <span class="red">RED</span> and reset.</p>
        <button class="cta" id="start-btn"></button>
      </div>
    </div>

    <div class="overlay hidden" id="win-overlay">
      <div class="card win-card" role="dialog" aria-modal="true" aria-labelledby="win-heading">
        <div class="trophy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg></div>
        <h2 id="win-heading"></h2>
        <p class="win-msg" id="win-msg"></p>
        <ul class="summary" id="summary"></ul>
        <p class="discuss" id="discuss"></p>
        <button class="cta" id="again-btn"></button>
      </div>
    </div>
  </main>

  <footer id="legend-footer"></footer>

<script>
const GAME = {"title": "Triangles of Impact", "subtitle": "Inspired by the AI News · November 2026", "intro_text": "Click 3 nodes that belong to the same genAI idea. Watch out: some could fit more than one!", "win_message": "This month's genAI ideas have been mapped.", "discussion": "Which guardrail would you want in place before an AI agent works on your behalf?", "triangles": [{"label": "Agent risks", "members": ["Prompt Injection", "Data Leakage", "Overreach"], "clue": "Three ways an AI agent can go wrong", "why": "This month a stray instruction file hijacked a coding agent in testing, a report found most workplace agents had no data-loss protection, and safety testers caught a model taking actions nobody had authorised.", "colour": "#EAB308"}, {"label": "Agent guardrails", "members": ["Permissions", "Spend Cap", "Human Approval"], "clue": "Limits you set before letting an AI agent act for you", "why": "Google's new work agent gets its own account, its own permissions and a spending limit, and GitHub's automations suggest improvements that a person approves or rejects.", "colour": "#A855F7"}, {"label": "Steering a model", "members": ["System Prompt", "Reasoning Effort", "Temperature"], "clue": "Dials and settings that change how a model answers", "why": "Standing instructions, how hard it thinks, how adventurous it is. Snowflake's coding agents just added controls for the first two.", "colour": "#06B6D4"}, {"label": "Beyond text", "members": ["Speech", "Images", "Video"], "clue": "Kinds of content AI now handles besides words on a page", "why": "Nvidia released an open model that transcribes speech in 40 languages, Google's Genie 4 generates interactive scenes with sound, and UCLA researchers built an AI that spots deepfake videos with nearly 98% accuracy.", "colour": "#10B981"}], "intro_heading": "Identify the Triangles", "start_button": "Start Discovery", "win_heading": "SYNCHRONIZED", "reset_button": "Reset Workshop"};

const ICON_CHECK = '<span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>';
const ICON_X = '<span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></span>';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T = GAME.triangles;
const hasClues = T.some(t => t.clue);

let nodes = [], selected = [], solved = [], feedback = null, mistakes = 0;

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* Lay the nodes round a circle in a random order, re-dealing if members of the same
   triangle clump together. One neighbouring pair is allowed so that "neighbours never
   match" can't become a rule learners spot and exploit. */
function deal() {
  const all = T.flatMap((t, ti) => t.members.map(name => ({ name, ti })));
  let order;
  for (let tries = 0; tries < 200; tries++) {
    order = shuffle(all);
    let adjacent = 0;
    for (let i = 0; i < order.length; i++) if (order[i].ti === order[(i + 1) % order.length].ti) adjacent++;
    if (adjacent <= 1) break;
  }
  const n = order.length, r = 40, offset = Math.PI / n; // offset keeps a node off the very top and bottom, where pills crowd
  nodes = order.map((o, i) => {
    const a = (i / n) * 2 * Math.PI - Math.PI / 2 + offset;
    return { id: i, name: o.name, ti: o.ti, x: 50 + r * Math.cos(a), y: 50 + r * Math.sin(a) };
  });
}

function sizeBoard() {
  const stage = $('stage'), cs = getComputedStyle(stage);
  const w = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const h = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  // A gentle oval at most 1.6 times wider than tall: wide enough that the top and bottom
  // pairs of names have room, not so wide that triangles look squashed.
  const bh = Math.max(220, Math.min(h, w * 1.35)); // on a portrait phone, let it stand a little taller
  const bw = Math.max(220, Math.min(w, bh * 1.6));
  const board = $('board');
  board.style.width = bw + 'px'; board.style.height = bh + 'px';
  fitText(Math.min(bw, bh));
  renderLabels();
}

/* One shared text size for every node: start large and step down until no two
   nodes overlap, so long names never collide and no name stands out by size. */
function fitText(s) {
  const board = $('board');
  let fs = Math.min(22, s * 0.034);
  const els = [...document.querySelectorAll('.node')];
  const overlaps = () => {
    const rs = els.map(e => e.getBoundingClientRect());
    for (let i = 0; i < rs.length; i++) for (let j = i + 1; j < rs.length; j++) {
      const a = rs[i], b = rs[j], g = 14; // room for a selected pill to grow 10%
      if (a.left < b.right + g && b.left < a.right + g && a.top < b.bottom + g && b.top < a.bottom + g) return true;
    }
    return false;
  };
  while (true) {
    board.style.setProperty('--fs', fs + 'px');
    if (fs <= 9 || !overlaps()) break;
    fs -= 0.5;
  }
}

function renderLegend() {
  const f = $('legend-footer');
  f.classList.toggle('with-clues', hasClues);
  f.innerHTML = T.map((t, i) => `
    <div class="legend-item" id="legend-${i}">
      <span class="legend-dot" style="background:${t.colour}"></span>
      <span class="legend-label">${esc(t.label)}${t.clue ? `<span class="legend-clue">${esc(t.clue)}</span>` : ''}</span>
    </div>`).join('');
}

function renderNodes() {
  $('nodes-layer').innerHTML = nodes.map(n => {
    const isSel = selected.includes(n.id), isSolved = solved.includes(n.ti), t = T[n.ti];
    let cls = 'node', style = `left:${n.x}%;top:${n.y}%;`, icon = '';
    if (isSolved) { cls += ' solved'; style += `border-color:${t.colour};color:${t.colour};box-shadow:0 0 20px ${t.colour}66;`; icon = ICON_CHECK; }
    else if (isSel) {
      cls += ' selected';
      if (feedback === 'incorrect') { cls += ' incorrect'; icon = ICON_X; }
      else if (feedback === 'correct') cls += ' correct';
    }
    const state = isSolved ? ', solved' : isSel ? ', selected' : '';
    return `<button class="${cls}" style="${style}" data-id="${n.id}" aria-label="${esc(n.name)}${state}" ${isSolved ? 'aria-disabled="true"' : ''}><span>${esc(n.name)}</span>${icon}</button>`;
  }).join('');
}

function pts(ids) { return ids.map(id => { const n = nodes.find(m => m.id === id); return `${n.x},${n.y}`; }).join(' '); }

function renderShapes() {
  let svg = '';
  solved.forEach(ti => {
    const ids = nodes.filter(n => n.ti === ti).map(n => n.id), c = T[ti].colour;
    svg += `<polygon points="${pts(ids)}" fill="${c}" fill-opacity="0.15"/>`
         + `<polygon points="${pts(ids)}" fill="none" stroke="${c}" stroke-width="3.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
  });
  if (selected.length) {
    const c = feedback === 'incorrect' ? '#ef4444' : feedback === 'correct' ? '#22c55e' : '#22d3ee';
    const w = feedback ? 4 : 2, dash = feedback ? '' : 'stroke-dasharray="6 6"';
    for (let i = 0; i < selected.length; i++) {
      const next = selected.length === 3 ? selected[(i + 1) % 3] : selected[i + 1];
      if (next === undefined) continue;
      const a = nodes.find(n => n.id === selected[i]), b = nodes.find(n => n.id === next);
      svg += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${c}" stroke-width="${w}" ${dash} stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
    }
    if (selected.length === 3) svg += `<polygon points="${pts(selected)}" fill="${c}" fill-opacity="${feedback ? 0.2 : 0.08}"/>`;
  }
  $('svg-layer').innerHTML = svg;
}

/* Name each locked triangle at its centre. If the name would sit under a pill or on another
   name, slide it step by step towards the middle of the board until it is clear. */
function renderLabels() {
  const layer = $('labels-layer');
  layer.innerHTML = solved.map(ti => {
    const ms = nodes.filter(n => n.ti === ti);
    const x = ms.reduce((s, n) => s + n.x, 0) / 3, y = ms.reduce((s, n) => s + n.y, 0) / 3;
    return `<div class="tri-label show" data-x="${x}" data-y="${y}" style="left:${x}%;top:${y}%;color:${T[ti].colour}">${esc(T[ti].label)}</div>`;
  }).join('');
  const pills = [...document.querySelectorAll('.node')].map(e => e.getBoundingClientRect());
  const placed = [];
  const hits = r => [...pills, ...placed].some(o => r.left < o.right + 4 && o.left < r.right + 4 && r.top < o.bottom + 4 && o.top < r.bottom + 4);
  layer.querySelectorAll('.tri-label').forEach(el => {
    const x0 = +el.dataset.x, y0 = +el.dataset.y;
    const tries = [];
    for (let k = 0; k <= 10; k++) for (const dy of [0, 7, -7, 14, -14]) for (const dx of [0, 12, -12]) tries.push([x0 + (50 - x0) * k / 10 + dx, y0 + (50 - y0) * k / 10 + dy]);
    let best = tries[0];
    for (const [x, y] of tries) {
      el.style.left = x + '%'; el.style.top = y + '%';
      if (!hits(el.getBoundingClientRect())) { best = [x, y]; break; }
    }
    el.style.left = best[0] + '%'; el.style.top = best[1] + '%';
    placed.push(el.getBoundingClientRect());
  });
}

function renderStatus() {
  $('status').innerHTML = `Triangles found: <b>${solved.length}/${T.length}</b> &nbsp;·&nbsp; Mistakes: <b>${mistakes}</b>`;
  T.forEach((t, i) => $('legend-' + i).classList.toggle('on', solved.includes(i)));
}

function render() { renderNodes(); renderShapes(); renderLabels(); renderStatus(); }

function onNodeClick(id) {
  if (feedback) return;
  const n = nodes.find(m => m.id === id);
  if (solved.includes(n.ti)) return;
  if (selected.includes(id)) selected = selected.filter(s => s !== id);
  else if (selected.length < 3) selected.push(id);
  render();
  if (selected.length === 3) validate();
  const again = document.querySelector(`.node[data-id="${id}"]`); if (again) again.focus({ preventScroll: true });
}

function validate() {
  const ti = nodes.find(n => n.id === selected[0]).ti;
  const ok = selected.every(id => nodes.find(n => n.id === id).ti === ti);
  feedback = ok ? 'correct' : 'incorrect';
  if (!ok) mistakes++;
  render();
  setTimeout(() => {
    if (ok) solved.push(ti);
    selected = []; feedback = null;
    render();
    if (ok && solved.length === T.length) setTimeout(showWin, 700);
  }, ok ? 800 : 1000);
}

function showWin() {
  $('summary').innerHTML = T.map(t => `<li style="border-color:${t.colour}"><b>${esc(t.label)}</b> <span class="members">— ${t.members.map(esc).join(' + ')}</span>${t.why ? `<span class="why">${esc(t.why)}</span>` : ''}</li>`).join('');
  $('win-overlay').querySelector('.win-card').classList.toggle('compact', T.some(t => t.why));
  $('win-overlay').classList.remove('hidden');
  $('win-overlay').scrollTop = 0;
  $('again-btn').focus({ preventScroll: true });
}

function resetGame() {
  selected = []; solved = []; feedback = null; mistakes = 0;
  $('win-overlay').classList.add('hidden');
  deal(); render(); sizeBoard();
}

function setup() {
  document.title = GAME.title;
  $('title').textContent = GAME.title;
  $('subtitle').textContent = GAME.subtitle;
  $('intro-heading').textContent = GAME.intro_heading;
  $('intro-text').textContent = GAME.intro_text;
  $('start-btn').textContent = GAME.start_button;
  $('win-heading').textContent = GAME.win_heading;
  $('win-msg').textContent = GAME.win_message;
  $('again-btn').textContent = GAME.reset_button;
  const d = $('discuss'); if (GAME.discussion) d.textContent = 'Discuss: ' + GAME.discussion; else d.remove();

  $('nodes-layer').addEventListener('click', e => { const b = e.target.closest('.node'); if (b) onNodeClick(+b.dataset.id); });
  $('start-btn').onclick = () => $('instruction-overlay').classList.add('hidden');
  $('info-btn').onclick = () => $('instruction-overlay').classList.toggle('hidden');
  $('reset-btn').onclick = resetGame;
  $('again-btn').onclick = resetGame;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $('instruction-overlay').classList.add('hidden'); });
  window.addEventListener('resize', sizeBoard);

  renderLegend(); deal(); render();
  requestAnimationFrame(sizeBoard);
  $('start-btn').focus();
}
setup();
</script>
</body>
</html>
